# DespachoOps Index — producción Windows
# Código: C:\DespachoOps\despachoops-index
# Motor local: C:\DespachoOpsData\Index
# Resultados compartidos: \\Luiscp\d\Cebrian y Fraile Abogados\Index
scan_root: "\\\\Luiscp\\d\\Cebrian y Fraile Abogados\\Clientes"
data_dir: "C:/DespachoOpsData/Index"

shared_output_dir: "\\\\Luiscp\\d\\Cebrian y Fraile Abogados\\Index"
reports_dir: "\\\\Luiscp\\d\\Cebrian y Fraile Abogados\\Index\\reports"
latest_dir: "\\\\Luiscp\\d\\Cebrian y Fraile Abogados\\Index\\latest"

recursive: true
max_files_per_index_run: 5000
max_files_per_ocr_run: 150
catalog_each_night_cycle: false

index_text_enabled: true
index_skip_large_files_mb: 80
ocr_skip_large_files_mb: 120

ocr_worker_enabled: true
ocr_max_pages_per_file: 15
ocr_languages: spa+eng

night_window_start: "23:00"
night_window_end: "06:00"
require_idle_minutes: 10

exclude_dirs:
  - .git
  - .venv
  - __pycache__
  - node_modules
  - dist
  - build
  - 04_DUPLICADOS
  - 99_BACKUP
  - BACKUPS
  - PLANTILLAS

exclude_patterns:
  - "~$*"
  - Thumbs.db
  - .DS_Store
  - "*.tmp"
  - desktop.ini
  - "*.lock"
  - "*.crdownload"
  - "*.part"

exclude_path_patterns:
  - "*/.git/*"
  - "*/node_modules/*"
  - "*/descarga/css/*"
  - "*/descarga/js/*"
  - "*/css/images/*"
  - "*/css/image/*"

exclude_extensions:
  - .gif
  - .css
  - .js
  - .map
  - .ico
  - .svg
  - .woff
  - .woff2
  - .ttf
  - .eot
  - .less
  - .scss
  - .htm
  - .html

llm:
  enabled: true
  max_files_per_run: 20
  text_chars_for_prompt: 3500
  min_text_chars: 80
  release_model_after_batch: true
  enrich:
    model: qwen3:8b
    base_url: http://localhost:11434
    timeout_seconds: 120
    num_ctx: 4096
    num_predict: 512
    format: json
    keep_alive: 5m

worker:
  enabled: true
  interval_seconds: 600
  stale_lock_minutes: 180
